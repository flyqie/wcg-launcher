name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older run on the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config }}
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          # Not recursive: libvncserver carries two submodules of its own -- a web
          # client and a stylesheet for its documentation -- and neither is built.
          submodules: true

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-${{ matrix.config }}-x64
          path: Output/x64/${{ matrix.config }}/Launcher.exe
          if-no-files-found: error
