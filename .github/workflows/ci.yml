name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config }}
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        shell: pwsh
        run: |
          $build = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "${{ github.ref_name }} $("${{ github.sha }}".Substring(0, 7))"
          }
          cmake -S . -B build -A x64 "-DLAUNCHER_BUILD=$build"

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-${{ matrix.config }}-x64
          path: Output/x64/${{ matrix.config }}/Launcher.exe
          if-no-files-found: error

  pure:
    name: Release (LAUNCHER_VNC_PURE)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        shell: pwsh
        run: |
          $build = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "${{ github.ref_name }} $("${{ github.sha }}".Substring(0, 7))"
          }
          cmake -S . -B build-pure -A x64 -DLAUNCHER_VNC_PURE=ON "-DLAUNCHER_BUILD=$build"

      - name: Build
        run: cmake --build build-pure --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Release-x64-pure
          path: Output/x64/Release/Launcher.exe
          if-no-files-found: error
