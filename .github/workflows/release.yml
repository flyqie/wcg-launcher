name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        shell: pwsh
        run: |
          $build = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "${{ github.ref_name }} $("${{ github.sha }}".Substring(0, 7))"
          }
          cmake -S . -B build -A x64 "-DLAUNCHER_BUILD=$build"

      - name: Build
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Pack
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $zip = "Launcher-$ver-x64.zip"

          New-Item -ItemType Directory dist | Out-Null
          Copy-Item Output/x64/Release/Launcher.exe dist/
          Copy-Item Output/x64/Release/Launcher.pdb dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath $zip

          $src = "Launcher-$ver-source.zip"
          git archive --format=zip -o $src HEAD

          $root = (Get-Location).Path
          $deps = 'libvncserver', 'zlib', 'libjpeg-turbo'
          foreach ($d in $deps) {
            git -C "deps/$d" archive --format=zip -o "$root/Launcher-$ver-source-$d.zip" HEAD
          }

          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $zip" } | Out-File -Encoding utf8 "$zip.sha256"

          $wanted = @($zip, "$zip.sha256", $src) + ($deps | ForEach-Object { "Launcher-$ver-source-$_.zip" })
          foreach ($f in $wanted) {
            if (-not (Test-Path $f)) { throw "nothing to release: $f was not produced" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-${{ github.ref_name }}-x64
          path: |
            Launcher-${{ github.ref_name }}-x64.zip
            Launcher-${{ github.ref_name }}-x64.zip.sha256
            Launcher-${{ github.ref_name }}-source.zip
            Launcher-${{ github.ref_name }}-source-libvncserver.zip
            Launcher-${{ github.ref_name }}-source-zlib.zip
            Launcher-${{ github.ref_name }}-source-libjpeg-turbo.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Launcher-${{ github.ref_name }}-x64.zip" \
            "Launcher-${{ github.ref_name }}-x64.zip.sha256" \
            "Launcher-${{ github.ref_name }}-source.zip" \
            "Launcher-${{ github.ref_name }}-source-libvncserver.zip" \
            "Launcher-${{ github.ref_name }}-source-zlib.zip" \
            "Launcher-${{ github.ref_name }}-source-libjpeg-turbo.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
