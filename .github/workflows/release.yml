name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -A x64

      # The link is checked as part of this, and a build that picked up a DLL fails
      # here rather than in a container.
      - name: Build
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Pack
        shell: pwsh
        run: |
          $zip = "Launcher-${{ github.ref_name }}-x64.zip"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item Output/x64/Release/Launcher.exe dist/
          Copy-Item Output/x64/Release/Launcher.pdb dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath $zip
          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $zip" } | Out-File -Encoding utf8 "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-${{ github.ref_name }}-x64
          path: |
            Launcher-${{ github.ref_name }}-x64.zip
            Launcher-${{ github.ref_name }}-x64.zip.sha256
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Launcher-${{ github.ref_name }}-x64.zip" \
            "Launcher-${{ github.ref_name }}-x64.zip.sha256" \
            --title "${{ github.ref_name }}" \
            --generate-notes
