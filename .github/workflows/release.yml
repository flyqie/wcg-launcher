name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        shell: pwsh
        run: |
          $build = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "${{ github.ref_name }} $("${{ github.sha }}".Substring(0, 7))"
          }
          cmake -S . -B build -A x64 "-DLAUNCHER_BUILD=$build"

      # The link is checked as part of this, and a build that picked up a DLL fails
      # here rather than in a container.
      - name: Build
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Pack
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $zip = "Launcher-$ver-x64.zip"

          New-Item -ItemType Directory dist | Out-Null
          Copy-Item Output/x64/Release/Launcher.exe dist/
          Copy-Item Output/x64/Release/Launcher.pdb dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Copy-Item THIRD-PARTY.md dist/
          Copy-Item Docs dist/ -Recurse
          Compress-Archive -Path dist/* -DestinationPath $zip

          # GPL-2.0-or-later: LibVNCServer is linked statically, so the corresponding
          # source has to travel with the binary. The three submodules are part of it --
          # each is pinned to a commit, and each is archived at that commit here rather
          # than referenced, so the release is self-contained. See THIRD-PARTY.md.
          $src = "Launcher-$ver-source.zip"
          git archive --format=zip -o $src HEAD
          foreach ($d in 'libvncserver', 'zlib', 'libjpeg-turbo') {
            git -C "deps/$d" archive --format=zip -o "Launcher-$ver-source-$d.zip" HEAD
          }

          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $zip" } | Out-File -Encoding utf8 "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-${{ github.ref_name }}-x64
          path: |
            Launcher-${{ github.ref_name }}-x64.zip
            Launcher-${{ github.ref_name }}-x64.zip.sha256
            Launcher-${{ github.ref_name }}-source.zip
            Launcher-${{ github.ref_name }}-source-libvncserver.zip
            Launcher-${{ github.ref_name }}-source-zlib.zip
            Launcher-${{ github.ref_name }}-source-libjpeg-turbo.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Launcher-${{ github.ref_name }}-x64.zip" \
            "Launcher-${{ github.ref_name }}-x64.zip.sha256" \
            "Launcher-${{ github.ref_name }}-source.zip" \
            "Launcher-${{ github.ref_name }}-source-libvncserver.zip" \
            "Launcher-${{ github.ref_name }}-source-zlib.zip" \
            "Launcher-${{ github.ref_name }}-source-libjpeg-turbo.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
