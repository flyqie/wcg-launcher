name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Submodule revisions
        id: deps
        shell: bash
        run: |
          echo "rev=$(git submodule status | awk '{print $1}' | tr -d '\n' \
            | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            build/deps/libjpeg-turbo
            build/LauncherJpeg-prefix
          key: jpeg-${{ runner.os }}-${{ steps.deps.outputs.rev }}

      - name: Configure
        run: cmake -S . -B build -A x64

      # The link is checked as part of this, and a build that picked up a DLL fails
      # here rather than in a container.
      - name: Build
        run: cmake --build build --config Release

      - name: Pack
        shell: pwsh
        run: |
          $zip = "Launcher-${{ github.ref_name }}-x64.zip"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item Output/x64/Release/Launcher.exe dist/
          Copy-Item Output/x64/Release/Launcher.pdb dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath $zip
          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $zip" } | Out-File -Encoding utf8 "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-${{ github.ref_name }}-x64
          path: |
            Launcher-${{ github.ref_name }}-x64.zip
            Launcher-${{ github.ref_name }}-x64.zip.sha256
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Launcher-${{ github.ref_name }}-x64.zip" \
            "Launcher-${{ github.ref_name }}-x64.zip.sha256" \
            --title "${{ github.ref_name }}" \
            --generate-notes
